<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>capybara clicker – capycoins</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff4e6; --peach:#ffdcc4; --pink:#ffb7c5; --matcha:#bfe3b4; --butter:#ffe08a;
  --cocoa:#4a2c1d; --cocoa-soft:#7a5240;
  --display:'Chewy','Baloo 2','Comic Sans MS','Chalkboard SE',cursive;
  --body:'Fredoka','Arial Rounded MT Bold','Nunito','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:var(--body); color:var(--cocoa); font-size:1.1rem;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,183,197,.35) 0 2px, transparent 3px) 0 0/46px 46px,
    radial-gradient(circle at 70% 70%, rgba(255,224,138,.45) 0 2px, transparent 3px) 0 0/46px 46px,
    linear-gradient(180deg,#fff0dc 0%,#ffe3cf 55%,#ffd3c0 100%);
  background-attachment:fixed;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
a{color:inherit}
:focus-visible{outline:4px solid var(--pink); outline-offset:4px; border-radius:20px}
.wrap{max-width:760px; margin:0 auto; padding:0 20px 40px}
header{display:flex; align-items:center; justify-content:space-between; padding:18px 0; gap:12px}
.logo{font-family:var(--display); font-size:2rem; text-decoration:none; line-height:1}
.logo .b{color:#e8788f}
.back{font-weight:500; text-decoration:none; padding:8px 16px; border:3px solid var(--cocoa); border-radius:999px; background:#fff}
.back:hover{background:var(--butter)}
h1{font-family:var(--display); font-weight:400; font-size:clamp(2rem,6vw,3rem); text-align:center; margin:6px 0 4px}
.beta{font-family:var(--body); font-size:.9rem; font-weight:600; background:var(--butter); border:2px solid var(--cocoa); border-radius:999px; padding:2px 12px; vertical-align:middle}
.hint{text-align:center; color:var(--cocoa-soft); margin:0 0 20px}

.stats{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:12px}
.stat{background:rgba(255,255,255,.85); border:3px solid var(--cocoa); border-radius:22px; padding:10px 14px; text-align:center}
.stat small{display:block; font-size:.9rem; color:var(--cocoa-soft); font-weight:500}
.stat strong{font-family:var(--display); font-weight:400; font-size:2rem; line-height:1.1; display:block}
.stat.coin{background:var(--butter)}
.stat.coin strong{font-size:2.5rem}
.bar{height:16px; margin:14px 4px 0; background:#fff; border:3px solid var(--cocoa); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--pink),#ff9eb5); transition:width .08s}
.barlabel{text-align:center; font-size:.95rem; color:var(--cocoa-soft); margin:6px 0 0}

.arena{position:relative; display:flex; justify-content:center; padding:26px 0 6px}
.capy-btn{
  background:none; border:0; padding:0; cursor:pointer; width:min(66vw,310px); touch-action:manipulation;
  transform-origin:50% 90%; filter:drop-shadow(0 12px 0 rgba(74,44,29,.12));
}
.capy-btn img{width:100%; height:auto; display:block; pointer-events:none; -webkit-user-drag:none}

.pop{position:fixed; pointer-events:none; z-index:50; font-family:var(--display); font-size:1.7rem; color:#e8788f; text-shadow:0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff; animation:floatup .75s ease-out forwards; margin:-1em 0 0 -1em; white-space:nowrap}
.pop.h{font-size:1.2rem; color:#ff8fab; animation-name:drift; animation-duration:.8s}
@keyframes floatup{from{opacity:1; transform:translateY(0) scale(.8)} to{opacity:0; transform:translateY(-70px) scale(1.1)}}
@keyframes drift{from{opacity:1; transform:translate(0,0) scale(.6)} to{opacity:0; transform:translate(var(--dx),-60px) scale(1.2) rotate(var(--r))}}
.toast{position:fixed; left:50%; top:16px; transform:translate(-50%,-90px); background:var(--butter); border:3px solid var(--cocoa); border-radius:999px; padding:8px 22px; font-family:var(--display); font-size:1.4rem; z-index:60; transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.toast.show{transform:translate(-50%,0)}
.reset{display:block; margin:22px auto 0; background:none; border:0; font:inherit; font-size:.95rem; color:var(--cocoa-soft); text-decoration:underline dotted; cursor:pointer}

@media (max-width:520px){ .stats{grid-template-columns:1fr 1fr} .stat.coin{grid-column:1/-1} }
@media (prefers-reduced-motion:reduce){ .pop{animation-duration:.01s} .toast{transition:none} }
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite">+1 capycoin!</div>
<div class="wrap">
  <header>
    <a class="logo" href="index.html" aria-label="capycoins home"><span>capy</span><span class="b">coins</span></a>
    <a class="back" href="index.html">← Home</a>
  </header>

  <h1>capybara clicker <span class="beta">BETA</span></h1>
  <p class="hint">Click or tap the capybara. Each click is 1¢, and 100¢ makes 1 capycoin.</p>

  <div class="stats">
    <div class="stat coin"><small>capycoins</small><strong id="coins">0.00</strong></div>
    <div class="stat"><small>clicks per second</small><strong id="cps">0</strong></div>
    <div class="stat"><small>best CPS</small><strong id="best">0</strong></div>
  </div>
  <div class="bar" role="progressbar" aria-label="Progress to next capycoin" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
  <p class="barlabel"><span id="cents">0</span>¢ total · <span id="togo">100</span>¢ to the next capycoin</p>

  <div class="arena">
    <button class="capy-btn" id="capy" aria-label="Pet the capybara to earn 1 cent">
      <img src="capybara.png" alt="" width="640" height="835" draggable="false">
    </button>
  </div>
  <button class="reset" id="reset" type="button">reset progress</button>
</div>

<script>
(function(){
  var KEY='capycoins_clicker_v1';
  var cents=0, clicks=0, best=0, times=[], saveTimer=null, anim=null, tilt=1, toastTimer=null;
  var $=function(id){return document.getElementById(id)};
  var btn=$('capy'), elCoins=$('coins'), elCps=$('cps'), elBest=$('best'),
      elCents=$('cents'), elTogo=$('togo'), elFill=$('fill'), bar=document.querySelector('.bar'), toast=$('toast');
  var reduce=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  try{
    var s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s){cents=s.cents|0; clicks=s.clicks|0; best=s.best|0;}
  }catch(e){}

  function save(){
    try{localStorage.setItem(KEY,JSON.stringify({cents:cents,clicks:clicks,best:best}));}catch(e){}
  }

  function render(){
    var rem=cents%100;
    elCoins.textContent=(cents/100).toFixed(2);
    elCents.textContent=cents.toLocaleString();
    elTogo.textContent=100-rem;
    elFill.style.width=rem+'%';
    bar.setAttribute('aria-valuenow',rem);
    elBest.textContent=best;
  }

  function squish(){
    if(anim) anim.cancel();
    if(!btn.animate || reduce) return;
    tilt=-tilt;
    anim=btn.animate([
      {transform:'scale(1,1) rotate(0deg)'},
      {transform:'scale(1.07,.92) rotate('+(tilt*2.5)+'deg)',offset:.35},
      {transform:'scale(.98,1.03) rotate('+(tilt*-1)+'deg)',offset:.7},
      {transform:'scale(1,1) rotate(0deg)'}
    ],{duration:170,easing:'ease-out'});
  }

  function spawn(x,y){
    if(document.querySelectorAll('.pop').length>36) return;
    var t=document.createElement('span');
    t.className='pop'; t.textContent='+1¢';
    t.style.left=(x+(Math.random()*40-20))+'px'; t.style.top=y+'px';
    var h=document.createElement('span');
    h.className='pop h'; h.textContent=['♡','✿','✦'][Math.floor(Math.random()*3)];
    h.style.left=x+'px'; h.style.top=y+'px';
    h.style.setProperty('--dx',(Math.random()*120-60)+'px');
    h.style.setProperty('--r',(Math.random()*80-40)+'deg');
    document.body.appendChild(t); document.body.appendChild(h);
    setTimeout(function(){t.remove(); h.remove();},850);
  }

  function showToast(){
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove('show')},1100);
  }

  function hit(x,y){
    cents++; clicks++;
    times.push(performance.now());
    squish(); spawn(x,y);
    if(cents%100===0) showToast();
    render();
    if(clicks%25===0) save();
  }

  btn.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.preventDefault();
    hit(e.clientX,e.clientY);
  });
  btn.addEventListener('keydown',function(e){
    if(e.key===' '||e.key==='Enter'){
      e.preventDefault();
      if(e.repeat) return;
      var r=btn.getBoundingClientRect();
      hit(r.left+r.width/2, r.top+r.height/3);
    }
  });
  btn.addEventListener('contextmenu',function(e){e.preventDefault()});

  setInterval(function(){
    var now=performance.now();
    while(times.length && now-times[0]>1000) times.shift();
    var c=times.length;
    elCps.textContent=c;
    if(c>best){best=c; elBest.textContent=best;}
  },100);

  $('reset').addEventListener('click',function(){
    if(confirm('Reset your cents and best CPS?')){
      cents=0; clicks=0; best=0; times=[]; save(); render(); elCps.textContent=0;
    }
  });

  window.addEventListener('pagehide',save);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) save(); });
  render();
})();
</script>
</body>
</html>
