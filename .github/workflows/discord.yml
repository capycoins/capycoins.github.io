name: Discord notify

on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  create:
  delete:
  fork:
  watch:
    types: [started]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMPARE: ${{ github.event.compare }}
          COMMITS: ${{ toJson(github.event.commits) }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF_NAME: ${{ github.event.ref }}
          FORK_NAME: ${{ github.event.forkee.full_name }}
          FORK_URL: ${{ github.event.forkee.html_url }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          trunc() { printf '%s' "$1" | head -c "$2"; }
          COLOR=5814783
          DESC=""

          case "$EVENT" in
            push)
              COUNT=$(echo "$COMMITS" | jq 'length')
              [ "$COUNT" -eq 0 ] && exit 0
              TITLE="📦 $COUNT new commit(s) on $BRANCH"
              URL="$COMPARE"
              DESC=$(echo "$COMMITS" | jq -r '.[] | "[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0])"' | head -c 3500)
              ;;
            pull_request_target)
              URL="$PR_URL"
              DESC=$(trunc "$PR_BODY" 300)
              if [ "$ACTION" = closed ] && [ "$PR_MERGED" = true ]; then
                TITLE="🟣 PR #$PR_NUM merged: $PR_TITLE"; COLOR=10181046
              elif [ "$ACTION" = closed ]; then
                TITLE="🔴 PR #$PR_NUM closed: $PR_TITLE"; COLOR=15158332
              else
                TITLE="🟢 PR #$PR_NUM ${ACTION//_/ }: $PR_TITLE"; COLOR=3066993
              fi
              ;;
            issues)
              URL="$ISSUE_URL"
              DESC=$(trunc "$ISSUE_BODY" 300)
              if [ "$ACTION" = closed ]; then
                TITLE="✅ Issue #$ISSUE_NUM closed: $ISSUE_TITLE"; COLOR=15158332
              else
                TITLE="🐛 Issue #$ISSUE_NUM $ACTION: $ISSUE_TITLE"; COLOR=15105570
              fi
              ;;
            issue_comment)
              TITLE="💬 Comment on #$ISSUE_NUM: $ISSUE_TITLE"
              URL="$COMMENT_URL"
              DESC=$(trunc "$COMMENT_BODY" 500)
              ;;
            pull_request_review)
              TITLE="🔍 Review on PR #$PR_NUM (${REVIEW_STATE//_/ }): $PR_TITLE"
              URL="$REVIEW_URL"
              DESC=$(trunc "$REVIEW_BODY" 500)
              ;;
            create)
              TITLE="🌿 $REF_TYPE created: $REF_NAME"
              URL="$REPO_URL"
              ;;
            delete)
              TITLE="🗑️ $REF_TYPE deleted: $REF_NAME"
              URL="$REPO_URL"
              ;;
            fork)
              TITLE="🍴 Forked to $FORK_NAME"
              URL="$FORK_URL"
              ;;
            watch)
              TITLE="⭐ New star on $REPO"
              URL="$REPO_URL"
              COLOR=16766720
              ;;
            *)
              exit 0
              ;;
          esac

          PAYLOAD=$(jq -n \
            --arg title "$(trunc "$TITLE" 250)" \
            --arg desc "$DESC" \
            --arg url "$URL" \
            --argjson color "$COLOR" \
            --arg footer "$REPO · $ACTOR" \
            '{
              embeds: [
                ({title: $title, url: $url, color: $color, footer: {text: $footer}}
                 + (if $desc == "" then {} else {description: $desc} end))
              ],
              allowed_mentions: {parse: []}
            }')

          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"