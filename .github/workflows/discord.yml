name: Discord notify

on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  create:
  delete:
  fork:
  watch:
    types: [started]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMITS: ${{ toJson(github.event.commits) }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF_NAME: ${{ github.event.ref }}
          FORK_NAME: ${{ github.event.forkee.full_name }}
          FORK_URL: ${{ github.event.forkee.html_url }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          trunc() { printf '%s' "$1" | head -c "$2"; }
          # Turns text into a Discord quote block (empty input gives nothing)
          quote() {
            [ -z "$1" ] && return
            printf '\n'
            printf '%s' "$1" | head -c "$2" | sed 's/^/> /'
          }
          NL=$'\n'

          case "$EVENT" in
            push)
              COUNT=$(echo "$COMMITS" | jq 'length')
              [ "$COUNT" -eq 0 ] && exit 0
              MSG=$(echo "$COMMITS" | jq -r --arg b "$BRANCH" '
                map(
                  "📦 Commit [`\(.id[0:7])`](<\(.url)>): \"\(.message | split("\n")[0])\"\n" +
                  "✏️ Committed by **\(.author.name)** on branch `\($b)`"
                ) | join("\n\n")')
              ;;
            pull_request_target)
              if [ "$ACTION" = closed ] && [ "$PR_MERGED" = true ]; then
                ICON="🟣"; VERB="merged"
              elif [ "$ACTION" = closed ]; then
                ICON="🔴"; VERB="closed"
              else
                ICON="🟢"; VERB="${ACTION//_/ }"
              fi
              MSG="$ICON Pull request [#$PR_NUM](<$PR_URL>) **$VERB**: \"$PR_TITLE\"${NL}👤 By **$ACTOR** in \`$REPO\`$(quote "$PR_BODY" 300)"
              ;;
            issues)
              if [ "$ACTION" = closed ]; then ICON="✅"; else ICON="🐛"; fi
              MSG="$ICON Issue [#$ISSUE_NUM](<$ISSUE_URL>) **$ACTION**: \"$ISSUE_TITLE\"${NL}👤 By **$ACTOR** in \`$REPO\`$(quote "$ISSUE_BODY" 300)"
              ;;
            issue_comment)
              MSG="💬 [Comment](<$COMMENT_URL>) on #$ISSUE_NUM: \"$ISSUE_TITLE\"${NL}👤 By **$ACTOR** in \`$REPO\`$(quote "$COMMENT_BODY" 500)"
              ;;
            pull_request_review)
              MSG="🔍 [Review](<$REVIEW_URL>) on PR #$PR_NUM (**${REVIEW_STATE//_/ }**): \"$PR_TITLE\"${NL}👤 By **$ACTOR** in \`$REPO\`$(quote "$REVIEW_BODY" 500)"
              ;;
            create)
              MSG="🌿 New $REF_TYPE created: \`$REF_NAME\`${NL}👤 By **$ACTOR** in \`$REPO\`"
              ;;
            delete)
              MSG="🗑️ $REF_TYPE deleted: \`$REF_NAME\`${NL}👤 By **$ACTOR** in \`$REPO\`"
              ;;
            fork)
              MSG="🍴 **$ACTOR** forked \`$REPO\` to [$FORK_NAME](<$FORK_URL>)"
              ;;
            watch)
              MSG="⭐ **$ACTOR** starred [\`$REPO\`](<$REPO_URL>)"
              ;;
            *)
              exit 0
              ;;
          esac

          PAYLOAD=$(jq -n --arg content "$(trunc "$MSG" 1900)" \
            '{content: $content, allowed_mentions: {parse: []}}')

          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"