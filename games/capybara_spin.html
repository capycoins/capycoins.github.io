<title>daily spin – capycoins</title>

<style>
:root{
  --cream:#fff4e6; --peach:#ffdcc4; --pink:#ffb7c5; --matcha:#bfe3b4; --butter:#ffe08a;
  --cocoa:#4a2c1d; --cocoa-soft:#7a5240;
  --display:'Chewy','Baloo 2','Comic Sans MS','Chalkboard SE',cursive;
  --body:'Fredoka','Arial Rounded MT Bold','Nunito','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:var(--body); color:var(--cocoa); font-size:1.1rem;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,183,197,.35) 0 2px, transparent 3px) 0 0/46px 46px,
    radial-gradient(circle at 70% 70%, rgba(255,224,138,.45) 0 2px, transparent 3px) 0 0/46px 46px,
    linear-gradient(180deg,#fff0dc 0%,#ffe3cf 55%,#ffd3c0 100%);
  background-attachment:fixed;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
a{color:inherit}
:focus-visible{outline:4px solid var(--pink); outline-offset:4px; border-radius:20px}
.wrap{max-width:760px; margin:0 auto; padding:0 20px 40px}
header{display:flex; align-items:center; justify-content:space-between; padding:18px 0; gap:12px}
.logo{font-family:var(--display); font-size:2rem; text-decoration:none; line-height:1}
.logo .b{color:#e8788f}
.back{font-weight:500; text-decoration:none; padding:8px 16px; border:3px solid var(--cocoa); border-radius:999px; background:#fff}
.back:hover{background:var(--butter)}
h1{font-family:var(--display); font-weight:400; font-size:clamp(2rem,6vw,3rem); text-align:center; margin:6px 0 4px}
.beta{font-family:var(--body); font-size:.9rem; font-weight:600; background:var(--butter); border:2px solid var(--cocoa); border-radius:999px; padding:2px 12px; vertical-align:middle}
.hint{text-align:center; color:var(--cocoa-soft); margin:0 0 20px}

.stats{display:grid; grid-template-columns:1.3fr 1.3fr 1fr 1fr; gap:12px}
.stat{background:rgba(255,255,255,.85); border:3px solid var(--cocoa); border-radius:22px; padding:10px 14px; text-align:center}
.stat small{display:block; font-size:.9rem; color:var(--cocoa-soft); font-weight:500}
.stat strong{font-family:var(--display); font-weight:400; font-size:2rem; line-height:1.1; display:block}
.stat.coin{background:var(--butter)}
.stat.coin strong{font-size:2.5rem}
.bar{height:16px; margin:14px 4px 0; background:#fff; border:3px solid var(--cocoa); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--pink),#ff9eb5); transition:width .08s}
.barlabel{text-align:center; font-size:.95rem; color:var(--cocoa-soft); margin:6px 0 0}


.toast{position:fixed; left:50%; top:16px; transform:translate(-50%,-90px); background:var(--butter); border:3px solid var(--cocoa); border-radius:999px; padding:8px 22px; font-family:var(--display); font-size:1.4rem; z-index:60; transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.toast.show{transform:translate(-50%,0)}

@media (max-width:600px){ .stats{grid-template-columns:1fr 1fr} }

.stat strong{font-size:1.8rem}
.stat.coin strong{font-size:2rem}
.stage{position:relative; margin-top:16px; border:3px solid var(--cocoa); border-radius:26px; overflow:hidden; background:#ffe9d6; box-shadow:0 6px 0 var(--cocoa); touch-action:manipulation; cursor:pointer}
canvas{display:block; width:100%; height:auto; aspect-ratio:900/300}
.overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; padding:12px; pointer-events:none; background:rgba(255,244,230,.55)}
.overlay.hide{display:none}
.overlay h2{font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,5vw,2.6rem); margin:0; line-height:1.1}
.overlay p{margin:0; max-width:34ch; color:var(--cocoa); font-weight:500; font-size:clamp(.95rem,2.6vw,1.15rem)}
.overlay .go{margin-top:6px; background:var(--butter); border:3px solid var(--cocoa); border-radius:999px; padding:6px 20px; font-weight:600}
.reward{margin:14px 4px 0}
.reward .bar{margin:0}
.reward .bar i{background:linear-gradient(90deg,var(--butter),#ffb36b)}
.keys{text-align:center; color:var(--cocoa-soft); font-size:.95rem; margin:8px 0 0}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

canvas{aspect-ratio:640/520; touch-action:none}
.stage{max-width:640px; margin:16px auto 0; cursor:pointer}
.legend{max-width:640px; margin:22px auto 0}
.legend h2{font-family:var(--display); font-weight:400; font-size:1.8rem; margin:0 0 4px; text-align:center}
.legend p.sub{text-align:center; margin:0 0 12px; color:var(--cocoa-soft); font-size:1rem}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:10px}
.tile{background:rgba(255,255,255,.88); border:3px solid var(--cocoa); border-radius:20px; padding:12px 10px; text-align:center; line-height:1.3; font-size:.95rem}
.tile .icon{font-size:2rem; display:flex; align-items:flex-end; justify-content:center; margin:0 auto 4px; line-height:1.1; height:58px}
.tile .icon img{height:44px; width:auto}
.tile b{font-family:var(--display); font-weight:400; font-size:1.25rem; display:block}
.tile small{color:var(--cocoa-soft)}
.overlay{justify-content:flex-start; padding-top:46px}
.snd{background:none; border:0; font:inherit; font-size:.95rem; color:var(--cocoa-soft); text-decoration:underline dotted; cursor:pointer; margin-left:10px}

.overlay{justify-content:flex-start; padding-top:40px}
.msg{text-align:center; min-height:1.6em; margin:12px 0 0; font-weight:500; color:var(--cocoa)}
.msg b{font-family:var(--display); font-weight:400; font-size:1.25rem}
.panel{max-width:640px; margin:22px auto 0; background:rgba(255,255,255,.88); border:3px solid var(--cocoa); border-radius:26px; padding:16px 18px 18px}
.panel h2{font-family:var(--display); font-weight:400; font-size:1.8rem; margin:0 0 2px}
.panel .sub{margin:0 0 12px; color:var(--cocoa-soft); font-size:1rem}
.bag-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.btn{font-family:var(--body); font-weight:600; font-size:1.05rem; padding:10px 20px; border-radius:999px; border:3px solid var(--cocoa); background:var(--butter); color:var(--cocoa); box-shadow:0 4px 0 var(--cocoa); cursor:pointer; transition:transform .1s, box-shadow .1s}
.btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 6px 0 var(--cocoa)}
.btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--cocoa)}
.btn:disabled{opacity:.5; cursor:not-allowed; box-shadow:0 2px 0 var(--cocoa)}
.items{display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:10px; margin-top:12px}
.item{border:3px solid var(--cocoa); border-radius:18px; padding:8px 8px 10px; text-align:center; background:#fff; font-size:.9rem; line-height:1.25}
.item img{height:46px; width:auto; max-width:64px; object-fit:contain; display:block; margin:0 auto 2px}
.item b{font-family:var(--display); font-weight:400; font-size:1.1rem; display:block}
.item small{color:var(--cocoa-soft); display:block}
.item .sellbtn{margin-top:6px; font:inherit; font-size:.85rem; font-weight:600; padding:3px 12px; border-radius:999px; border:2px solid var(--cocoa); background:var(--matcha); color:var(--cocoa); cursor:pointer}
.item .sellbtn:hover{background:var(--butter)}
.item.new{animation:itempop .7s}
@keyframes itempop{0%{transform:scale(.8)} 40%{transform:scale(1.12); background:var(--butter)} 100%{transform:scale(1)}}
.empty{text-align:center; color:var(--cocoa-soft); padding:14px 0 4px}
.tier{font-family:var(--display); font-size:1.2rem; margin:14px 0 6px}
.tier span{font-family:var(--body); font-size:.9rem; color:var(--cocoa-soft)}
.gitems{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
.gitem{border:2px solid var(--cocoa); border-radius:14px; padding:6px; text-align:center; font-size:.85rem; line-height:1.2; background:#fff}
.gitem img{height:34px; width:auto; max-width:48px; object-fit:contain; display:block; margin:0 auto 2px}
.gitem small{display:block; color:var(--cocoa-soft)}
@media (prefers-reduced-motion:reduce){ .item.new{animation:none} .btn{transition:none} }

.wheelbox{max-width:520px;margin:6px auto 0;text-align:center}
#cv{display:block;width:100%;max-width:470px;height:auto;aspect-ratio:1;margin:0 auto}
.btn.big{font-size:1.7rem;padding:16px 70px;background:var(--pink);margin-top:10px}
.msg{min-height:2.4em;font-size:1.25rem}
.msg b{font-family:var(--display);font-weight:400;font-size:1.6rem}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.plist div{border:2px solid var(--cocoa);border-radius:14px;padding:8px 4px;text-align:center;background:#fff;line-height:1.2}
.plist b{font-family:var(--display);font-weight:400;font-size:1.5rem;display:block}.plist small{color:var(--soft);display:block}

<div class="wrap">
 <header><a class="logo" href="../index.html" aria-label="capycoins home"><span>capy</span><span class="b">coins</span></a><a class="back" href="../play.html">← Dashboard</a></header>

 const SLICES=[3,5,3,8,4,12,3,6,5,15,4,10];          /* capycoins per slice - edit to change the wheel */
 const COLORS={3:'#ffd9c4',4:'#ffc9d6',5:'#fff0b3',6:'#d9f0c8',8:'#bfe3b4',10:'#a9ddeb',12:'#ffb7c5',15:'#ffe08a'};
 const KEY='capycoins_wallet_v1',OLD='capycoins_clicker_v1',SPIN='capycoins_spin_v1',SND='capycoins_sound';
 const $=id=>document.getElementById(id),N=SLICES.length,SIZE=Math.PI*2/N;
 const dkey=()=>{const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)};
 function readW(){const w={total:0,clicks:0,best:0,days:{},games:{}};
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');
   if(s&&typeof s.total==='number'){w.total=s.total|0;w.clicks=s.clicks|0;w.best=s.best|0;w.days=s.days||{};w.games=s.games||{};}
   else{const o=JSON.parse(localStorage.getItem(OLD)||'null');if(o){w.total=o.cents|0;w.clicks=o.clicks|0;w.best=o.best|0;w.games.clicker=w.total;}}}catch(e){}
  return w;}
 function addCents(c){const w=readW(),k=dkey();w.total+=c;w.days[k]=(w.days[k]|0)+c;w.games.spin=(w.games.spin|0)+c;
  const keep=Object.keys(w.days).sort().slice(-60),d2={};keep.forEach(x=>{d2[x]=w.days[x]});w.days=d2;
  try{localStorage.setItem(KEY,JSON.stringify(w));}catch(e){}}
 const getSpin=()=>{try{return JSON.parse(localStorage.getItem(SPIN)||'null')||{};}catch(e){return {};}};
 const spunToday=()=>getSpin().last===dkey();
 const showBal=()=>{$('bal').textContent=CC(readW().total);};
 addEventListener('capy-wallet-changed',showBal);

 /* sound + toast */
 let muted=false;try{muted=localStorage.getItem(SND)==='off';}catch(e){}
 $('snd').textContent='Sound: '+(muted?'off':'on');
 $('snd').addEventListener('click',()=>{muted=!muted;$('snd').textContent='Sound: '+(muted?'off':'on');try{localStorage.setItem(SND,muted?'off':'on');}catch(e){}});
 let ac=null;
 function tone(f1,f2,type,dur,vol,delay){ if(muted)return;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!ac&&AC)ac=new AC();if(!ac)return;if(ac.state==='suspended')ac.resume();
   const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);
   if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.008,t+dur);
   o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);}catch(e){}}
 const toastEl=$('toast');let tt=null;
 function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2200);}

 /* prize list */
 (function(){const c={};SLICES.forEach(v=>c[v]=(c[v]||0)+1);
  $('plist').innerHTML=Object.keys(c).map(Number).sort((a,b)=>a-b).map(v=>'<div><b>'+v+'</b><small>capycoins</small><small>'+(c[v]/N*100).toFixed(1)+'%</small></div>').join('');})();

 /* wheel */
 const cv=$('cv'),ctx=cv.getContext('2d'),W=470,CX=W/2,R=205;
 const dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=W*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 const capyImg=new Image();capyImg.src=CAPY.src;
 let theta=0,spinning=false,anim=null,lastSlice=0,bump=0,T=0,confetti=[];
 function draw(){
  ctx.clearRect(0,0,W,W);
  ctx.save();ctx.translate(CX,CX);
  ctx.fillStyle='#f0c9a4';ctx.strokeStyle='#4a2c1d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,R+22,0,7);ctx.fill();ctx.stroke();
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2,on=spinning?((i+Math.floor(T*10))%2===0):(i%2===0);
   ctx.fillStyle=on?'#ffe08a':'#fff';ctx.beginPath();ctx.arc(Math.cos(a)*(R+11),Math.sin(a)*(R+11),4.2,0,7);ctx.fill();}
  ctx.rotate(theta);
  for(let i=0;i<N;i++){
   ctx.save();ctx.rotate(i*SIZE);
   ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,-Math.PI/2-SIZE/2,-Math.PI/2+SIZE/2);ctx.closePath();
   ctx.fillStyle=COLORS[SLICES[i]];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#4a2c1d';ctx.stroke();
   ctx.fillStyle='#4a2c1d';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.font="400 38px Chewy,'Comic Sans MS',cursive";ctx.fillText(SLICES[i],0,-R*.68);
   ctx.font="500 12px Fredoka,sans-serif";ctx.fillText('capycoins',0,-R*.68+24);
   ctx.restore();}
  ctx.restore();
  // hub with the capybara
  ctx.save();ctx.translate(CX,CX);ctx.fillStyle='#ffe08a';ctx.strokeStyle='#4a2c1d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,50,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,44,0,7);ctx.clip();
  if(capyImg.complete&&capyImg.naturalWidth){const s=100/CAPY.w;ctx.drawImage(capyImg,-50,-48,100,CAPY.h*s);}
  ctx.restore();
  // pointer
  ctx.save();ctx.translate(CX,CX-R-14);ctx.rotate(-bump*.45);
  ctx.fillStyle='#ffb7c5';ctx.strokeStyle='#4a2c1d';ctx.lineWidth=4;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-16,-12);ctx.lineTo(16,-12);ctx.lineTo(0,34);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  // confetti
  confetti.forEach(p=>{ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,p.life);ctx.fillRect(p.x,p.y,7,5);});ctx.globalAlpha=1;
 }
 function sliceUnderPointer(th){const k=Math.round(((-th/SIZE)%N+N)%N)%N;return k;}
 const reduce=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 let last=0;
 function frame(now){
  const dt=Math.min((now-last)/1000||0,.05);last=now;T+=dt;bump=Math.max(0,bump-dt*5);
  if(anim){
   const k=Math.min(1,(now-anim.t0)/anim.dur),e=1-Math.pow(1-k,4);
   theta=anim.from+(anim.to-anim.from)*e;
   const s=Math.floor(theta/SIZE+.5);if(s!==lastSlice){lastSlice=s;bump=1;tone(900,700,'square',.04,.05);}
   if(k>=1){anim=null;finish();}
  }
  confetti.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt*.6;});confetti=confetti.filter(p=>p.life>0);
  draw();requestAnimationFrame(frame);
 }
 let prize=0;
 function lock(){
  const s=getSpin(),done=s.last===dkey();
  $('spin').disabled=spinning||done;$('spin').textContent=spinning?'Spinning…':(done?'Come back tomorrow':'Spin!');
  $('today').textContent=done?s.prize+' capycoins':'–';
 }
 function startSpin(){
  if(spinning||spunToday())return;
  spinning=true;const k=Math.floor(Math.random()*N);prize=SLICES[k];
  addCents(prize*100);                                              // paid right away, so reloading mid-spin can't give a second spin
  try{localStorage.setItem(SPIN,JSON.stringify({last:dkey(),prize:prize}));}catch(e){}
  lock();$('msg').textContent='Good luck…';
  const jitter=(Math.random()-.5)*SIZE*.6,base=-k*SIZE+jitter,turns=(reduce?2:5+Math.floor(Math.random()*3))*Math.PI*2;
  const to=base+Math.PI*2*Math.ceil((theta+turns-base)/(Math.PI*2));
  lastSlice=Math.floor(theta/SIZE+.5);anim={from:theta,to:to,t0:performance.now(),dur:reduce?1400:5200};
  tone(400,800,'sine',.2,.1);
 }
 function finish(){
  spinning=false;showBal();lock();
  $('msg').innerHTML='You won <b>'+prize+' capycoins</b>! 🎉';
  toast('+'+prize+' capycoins!');
  [0,.09,.18].forEach((d,i)=>tone([523,659,784][i],null,'triangle',.2,.16,d));
  for(let i=0;i<60;i++)confetti.push({x:CX+(Math.random()-.5)*60,y:CX-40,vx:(Math.random()-.5)*420,vy:-200-Math.random()*300,c:['#ffe08a','#ffb7c5','#bfe3b4','#a9ddeb','#fff'][i%5],life:1});
 }
 $('spin').addEventListener('click',startSpin);
 addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!(e.target&&e.target.tagName==='BUTTON')){e.preventDefault();if(!e.repeat)startSpin();}});

 /* countdown to local midnight */
 function tick(){
  if(!spunToday()){$('next').textContent='Ready!';if(!spinning)lock();return;}
  const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),ms=m-n,h=Math.floor(ms/36e5),mi=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  $('next').textContent=h+'h '+('0'+mi).slice(-2)+'m '+('0'+s).slice(-2)+'s';
 }
 setInterval(tick,1000);
 showBal();lock();tick();
 if(spunToday()&&!spinning)$('msg').innerHTML='Today you won <b>'+getSpin().prize+' capycoins</b>. See you tomorrow!';
 else $('msg').textContent='Press Spin to try your luck!';
 window.__spin={SLICES:SLICES,pick:()=>Math.floor(Math.random()*N)};
 requestAnimationFrame(frame);
})();
</script>
