<!DOCTYPE html>
<html lang="en" data-time="day"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'self' blob:"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>leaderboard – capycoins</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cocoa:#4a2c1d;--soft:#7a5240;--pink:#ffb7c5;--butter:#ffe08a;--matcha:#bfe3b4;--peach:#ffdcc4;
 --sky1:#fff0dc;--sky2:#ffd3c0;--hill:#f7bfa5;--sun:#ffe08a;--card:rgba(255,255,255,.86);
 --display:'Chewy','Baloo 2','Comic Sans MS','Chalkboard SE',cursive;--body:'Fredoka','Arial Rounded MT Bold','Nunito','Trebuchet MS',sans-serif}
html[data-time=night]{--sky1:#2b2350;--sky2:#6b4a7a;--hill:#4a3a6a;--sun:#fff4d6;--card:rgba(255,244,230,.92)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--body);color:var(--cocoa);font-size:1.1rem;line-height:1.55;overflow-x:hidden;
 background:radial-gradient(circle at 20% 20%,rgba(255,183,197,.3) 0 2px,transparent 3px) 0 0/46px 46px,linear-gradient(180deg,var(--sky1),var(--sky2));background-attachment:fixed;transition:background .6s}
html[data-time=night] body{color:#fff4e6}
html[data-time=night] .lead,html[data-time=night] .note{color:#f3d9e6}
a{color:inherit}:focus-visible{outline:4px solid var(--pink);outline-offset:3px;border-radius:14px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 22px;position:relative;z-index:2}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:2.2rem;text-decoration:none;line-height:1}.logo .b{color:#e8788f}
nav{display:flex;gap:18px;align-items:center;font-weight:500}
nav a{text-decoration:none;padding:4px 2px;border-bottom:3px dotted transparent}nav a:hover{border-color:var(--pink)}
.mode{font:inherit;font-size:1.2rem;background:var(--card);border:3px solid var(--cocoa);border-radius:999px;width:44px;height:44px;cursor:pointer;color:var(--cocoa)}
.btn{font-family:var(--body);font-weight:600;font-size:1.2rem;text-decoration:none;display:inline-block;padding:15px 34px;border-radius:999px;border:3px solid var(--cocoa);background:var(--butter);color:var(--cocoa);box-shadow:0 5px 0 var(--cocoa);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--cocoa)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cocoa)}
.btn.play{background:var(--pink);font-size:1.5rem;padding:16px 52px}.btn.soft{background:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,6vw,3.6rem);margin:6px 0 4px;line-height:1.05;text-align:center}
.lead{color:var(--soft);font-size:1.15rem;text-align:center;margin:0 auto;max-width:44ch}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;max-width:640px;margin:34px auto 6px}
.slot{min-width:0;text-align:center;--ring:#bcc6d2}
.slot.first{--ring:#f6c445}.slot.third{--ring:#cf8a52}
.crown{display:block;font-size:2.1rem;line-height:1;animation:bob 2s ease-in-out infinite}
.av{width:68px;height:68px;border-radius:50%;margin:0 auto 6px;border:5px solid var(--ring);background:#fff;display:grid;place-items:center;font-family:var(--display);font-size:2rem;color:var(--cocoa);box-shadow:0 4px 0 var(--cocoa)}
.first .av{width:88px;height:88px;font-size:2.7rem}
.nm{font-weight:600;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.cc{font-family:var(--display);font-size:1.3rem;line-height:1.2}
.cc small{font-family:var(--body);font-size:.8rem;display:block;color:var(--soft)}
html[data-time=night] .cc small{color:#f3d9e6}
.step{margin-top:8px;border:3px solid var(--cocoa);border-radius:18px 18px 0 0;display:grid;place-items:center;font-family:var(--display);font-size:3rem;color:var(--cocoa);transform-origin:bottom;animation:rise .9s cubic-bezier(.2,1.2,.4,1) both}
.first .step{height:170px;background:linear-gradient(#ffe08a,#f6c445);animation-delay:.25s}
.second .step{height:122px;background:linear-gradient(#f3f5f8,#bcc6d2);animation-delay:.1s}
.third .step{height:92px;background:linear-gradient(#f4be8c,#cf8a52);animation-delay:.4s}
.slot.empty{opacity:.55}.slot.empty .av{border-style:dashed;box-shadow:none;background:transparent;color:inherit}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}
.base{max-width:640px;margin:0 auto;height:14px;border-radius:0 0 14px 14px;background:var(--cocoa);opacity:.85}
.status{text-align:center;margin:18px auto 0;max-width:640px;min-height:1.6em;color:var(--soft)}
html[data-time=night] .status{color:#f3d9e6}
.banner{max-width:640px;margin:16px auto 0;background:var(--card);color:#4a2c1d;border:3px solid var(--cocoa);border-radius:22px;padding:12px 18px;text-align:center}
.banner a,.banner button{font:inherit;font-weight:600;color:inherit}
.banner button{background:var(--butter);border:2px solid var(--cocoa);border-radius:999px;padding:3px 14px;cursor:pointer;margin-left:6px}
.list{max-width:640px;margin:18px auto 0;display:grid;gap:8px;padding:0;list-style:none}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--card);color:#4a2c1d;border:3px solid var(--cocoa);border-radius:18px;padding:9px 16px}
.row .n{font-family:var(--display);font-size:1.4rem;text-align:center}
.row .u{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{font-family:var(--display);font-size:1.25rem}
.row.me{background:var(--butter)}.row.me .u:after{content:" (you)";font-weight:400;font-size:.9rem}
.refresh{display:block;margin:20px auto 0}
@media (max-width:520px){.av{width:56px;height:56px;font-size:1.6rem}.first .av{width:72px;height:72px;font-size:2.2rem}.nm{font-size:.95rem}.cc{font-size:1.1rem}.step{font-size:2.2rem}}
@media (prefers-reduced-motion:reduce){.step,.crown{animation:none}}
</style>
<script src="format.js"></script>
<script>window.CC=function(c){return window.CapyFormat?CapyFormat.cc(c):(c/100).toFixed(2)};</script>
</head><body>
<div class="wrap">
<header>
 <a class="logo" href="index.html" aria-label="capycoins home"><span>capy</span><span class="b">coins</span></a>
 <nav aria-label="Main"><a href="index.html">Home</a><a href="play.html">Play</a><a href="leaderboard.html" aria-current="page">Leaderboard</a><button class="mode" id="mode" type="button" aria-label="Switch to evening">🌙</button></nav>
</header>
<main>
 <h1>Leaderboard</h1>
 <p class="lead">The capycoin collectors with the biggest balances.</p>
 <div class="podium" id="podium" aria-label="Top three players"></div><div class="base" aria-hidden="true"></div>
 <div id="banner"></div>
 <ol class="list" id="list"></ol>
 <p class="status" id="status" aria-live="polite">Loading…</p>
 <button class="btn soft refresh" id="refresh" type="button" style="font-size:1rem;padding:10px 24px">Refresh</button>
</main>
<footer>made with love, oranges, and warm water · capycoins</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<script src="supabaseClient.js"></script>
<script src="account.js" data-prompt="false"></script>
<script>
const root=document.documentElement,mb=document.getElementById('mode');
function setTime(t){root.dataset.time=t;mb.textContent=t==='night'?'☀️':'🌙';mb.setAttribute('aria-label',t==='night'?'Switch to daytime':'Switch to evening');try{localStorage.setItem('capycoins_time',t)}catch(e){}}
let saved='day';try{saved=localStorage.getItem('capycoins_time')||'day'}catch(e){}
setTime(saved);mb.addEventListener('click',()=>setTime(root.dataset.time==='night'?'day':'night'));

const $=id=>document.getElementById(id);
let client=null;try{client=supabaseClient;}catch(e){}
const fmt=c=>CC(Number(c));
const exact=c=>(window.CapyFormat?CapyFormat.exact(c):(Number(c)/100).toFixed(2))+' capycoins';
const meName=()=>{const A=window.CapyAccount;return A&&A.profile&&A.profile.username?A.profile.username.toLowerCase():null;};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

function slot(cls,medal,place,p){
 const s=el('div','slot '+cls+(p?'':' empty'));
 if(medal==='first')s.append(el('span','crown','👑'));
 s.append(el('div','av',p?p.username.charAt(0).toUpperCase():'?'));
 s.append(el('div','nm',p?p.username:'Be the first!'));
 const cc=el('div','cc',p?fmt(p.total_cents):'–');if(p){cc.append(el('small','', 'capycoins'));cc.title=exact(p.total_cents);}s.append(cc);
 s.append(el('div','step',String(place)));
 return s;
}
let lastRows=[];
function render(rows){
 rows=(rows||[]).map(r=>({rank:Number(r.rank),username:String(r.username),total_cents:Number(r.total_cents)}));lastRows=rows;
 const pod=$('podium');pod.textContent='';
 pod.append(slot('second','second',2,rows[1]),slot('first','first',1,rows[0]),slot('third','third',3,rows[2]));
 const list=$('list'),me=meName();list.textContent='';
 rows.slice(3).forEach(r=>{
  const li=el('li','row'+(me&&r.username.toLowerCase()===me?' me':''));
  const ce=el('span','c',fmt(r.total_cents));ce.title=exact(r.total_cents);li.append(el('span','n','#'+r.rank),el('span','u',r.username),ce);list.append(li);});
 $('status').textContent=rows.length?'Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · top '+rows.length:'No one is on the board yet. Sign in, pick a username and earn some capycoins!';
 banner(rows);
}
async function banner(rows){
 const b=$('banner');b.textContent='';const A=window.CapyAccount;
 if(!A||!A.supported)return;
 if(!A.user){const d=el('div','banner');d.append('Want to be on the board? ');const a=el('a',null,'Sign in');a.href='index.html';d.append(a,' and pick a username.');b.append(d);return;}
 if(!A.profile||!A.profile.username){const d=el('div','banner','Pick a username to join the leaderboard.');const x=el('button',null,'Pick a username');x.type='button';x.addEventListener('click',()=>A.promptUsername(false));d.append(x);b.append(d);return;}
 const me=A.profile.username.toLowerCase();
 if(rows.some(r=>r.username.toLowerCase()===me))return;
 try{const r=await client.rpc('get_my_rank');
  if(!r.error&&r.data&&r.data.length){const d=el('div','banner');d.append('Your rank: ');d.append(el('b',null,'#'+Number(r.data[0].rank)));d.append(' with '+fmt(r.data[0].total_cents)+' capycoins');b.append(d);}
  else{const d=el('div','banner','Earn some capycoins to join the board!');b.append(d);}
 }catch(e){}
}
let loading=false;
async function load(){
 if(loading)return;loading=true;$('refresh').disabled=true;
 if(!client||!client.rpc){render([]);$('status').textContent='The leaderboard is offline. Check supabaseClient.js and your connection.';loading=false;$('refresh').disabled=false;return;}
 try{
  const A=window.CapyAccount;if(A&&A.user&&A.syncNow)await A.syncNow();      // make sure your latest coins are counted
  const r=await client.rpc('get_leaderboard',{max_rows:50});
  if(r.error)throw r.error;render(r.data);
 }catch(e){render([]);$('status').textContent='Could not load the leaderboard. Has supabase_leaderboard.sql been run in Supabase?';if(window.console)console.warn(e);}
 loading=false;$('refresh').disabled=false;
}
$('refresh').addEventListener('click',load);
render([]);$('status').textContent='Loading…';
function start(){load();}
if(window.CapyAccount&&CapyAccount.supported&&!CapyAccount.ready){let done=false;const go=()=>{if(!done){done=true;start();}};CapyAccount.onChange(go);setTimeout(go,1500);}else start();
if(window.CapyAccount)addEventListener('capy-account',()=>{if(!loading)banner(lastRows);});
setInterval(()=>{if(!document.hidden)load();},60000);
</script></body></html>
